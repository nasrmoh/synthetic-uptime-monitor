# Minimal Alertmanager config.
# Prometheus hands firing alerts to Alertmanager, which routes them here.
# 'default' receiver forwards to a webhook.site URL for Extra-tier
# delivery verification. Swap this for a real receiver (Slack/PagerDuty/
# email) when actual notification delivery matters.

route:
  receiver: 'default'
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: 'default'
    webhook_configs:
      - url: https://webhook.site/da341c73-0e43-4220-a482-b09ea5635c80