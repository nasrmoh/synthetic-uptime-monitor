server {
    listen 80;
    server_name synthetic.nasrmoha.dev;

    return 301 https://$host$request_uri;
}



server {
    listen 443 ssl;
    server_name synthetic.nasrmoha.dev;

    ssl_certificate /etc/letsencrypt/live/synthetic.nasrmoha.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetic.nasrmoha.dev/privkey.pem;

    location / {
        # Everyone can make read-only requests.
        #
        # For any other HTTP method, only allow requests that arrived
        # from this specific Tailscale address.
        limit_except GET HEAD {
            allow 100.x.x.x;  # Your laptop's Tailscale IP
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}