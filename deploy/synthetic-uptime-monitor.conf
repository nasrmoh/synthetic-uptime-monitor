server {
    listen 80;
    server_name synthetic.nasrmoha.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name synthetic.nasrmoha.dev;

    ssl_certificate /etc/letsencrypt/live/synthetic.nasrmoha.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetic.nasrmoha.dev/privkey.pem;

    # Only the exact root path redirects to FastAPI's Swagger docs.
    location = / {
        return 302 /docs;
    }

    # Everything else is proxied to FastAPI.
    location / {
        # Public deployment is read-only.
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}