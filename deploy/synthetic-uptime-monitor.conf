server {
    listen 80;
    server_name synthetic.nasrmoha.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name synthetic.nasrmoha.dev;

    ssl_certificate /etc/letsencrypt/live/synthetic.nasrmoha.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetic.nasrmoha.dev/privkey.pem;

    location = / {
        return 302 /docs;
    }

    location = /dashboard {
        return 302 https://observe.synthetic.nasrmoha.dev/public-dashboards/b0c26bbecb8e47b398d9bec617b0dece;
    }

    location / {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


server {
    listen 80;
    server_name observe.synthetic.nasrmoha.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name observe.synthetic.nasrmoha.dev;

    ssl_certificate /etc/letsencrypt/live/observe.synthetic.nasrmoha.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observe.synthetic.nasrmoha.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://100.70.122.99:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}