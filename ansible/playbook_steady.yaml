# ---------------------------------------------------------------------------
# Docker host setup
#
# Both the Azure VM and the Linux observability server run containers.
# This play installs Docker Engine and the Docker Compose plugin from
# Docker's official Ubuntu repository on both machines.
# ---------------------------------------------------------------------------

- name: Setup Docker Hosts
  hosts:
    - synth-vm
    - y540-server
  become: true

  tasks:
    # Refresh apt's package metadata before installing prerequisites.
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: yes

    # ca-certificates is required for validating HTTPS connections.
    # curl is useful both during setup and for later connectivity/debugging.
    - name: Install ca-certificates and curl
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl

    # Store third-party repository signing keys under apt's standard
    # keyring directory.
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Download Docker's signing key so apt can verify packages received
    # from Docker's repository.
    - name: Download Docker GPG key and set permissions
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    # Add Docker's official Ubuntu repository.
    #
    # The Azure VM uses ARM64 while the Linux server uses x86_64, so the
    # architecture is selected from Ansible's discovered host facts.
    - name: Add Docker DEB822 repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures:
          - "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
        signed_by: /etc/apt/keyrings/docker.asc

    # Refresh apt again so packages from the newly-added Docker repository
    # become available.
    - name: Re-Update apt package cache
      ansible.builtin.apt:
        update_cache: yes

    # Install Docker Engine, the CLI, containerd, Buildx, and the
    # Docker Compose plugin.
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    # Ensure Docker is running now and automatically starts after reboot.
    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: yes

    # Verify that the Docker Compose plugin installed above is available.
    # changed_when keeps this verification step from appearing as a change.
    - name: Run docker deploy version
      ansible.builtin.command: docker compose version
      changed_when: false


# ---------------------------------------------------------------------------
# nginx and Certbot installation
#
# nginx provides the public HTTP/HTTPS entry point for the application.
# Certbot and its nginx plugin are used to obtain and manage the
# Let's Encrypt TLS certificate.
#
# Only the Azure VM needs these packages because it is the public-facing
# application host.
# ---------------------------------------------------------------------------

- name: Setup nginx and Certbot
  hosts: synth-vm
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name:
          - nginx
          - certbot
          - python3-certbot-nginx


# ---------------------------------------------------------------------------
# Application identities
#
# root
#   = owns and modifies deployed configuration and application files
#
# synth-admin
#   = human administrator used for SSH and administrative work
#   = receives normal application file access through synth-app
#   = uses sudo when privileged changes are required
#
# synth-app-user
#   = service/deployment-oriented account
#   = receives application file access through synth-app
#   = belongs to docker so it can manage containers without sudo
#
# synth-app
#   = shared group granting read/traverse access to deployment files
#
# Membership in the docker group effectively grants significant host
# privileges, so synth-app-user should not be treated as a strong security
# boundary from root.
# ---------------------------------------------------------------------------

- name: Setup Application Group and Users
  hosts:
    - synth-vm
    - y540-server
  become: true

  tasks:
    # Shared group used to grant application-related accounts access to
    # files under /opt/synthetic-uptime-monitor.
    - name: Create App Group
      ansible.builtin.group:
        name: synth-app
        state: present

    # Create the application account and grant it both application file
    # access and permission to manage Docker.
    - name: Create the User
      ansible.builtin.user:
        name: synth-app-user
        state: present
        shell: /bin/bash
        groups:
          - synth-app
          - docker
        append: true

    # Give the administrative user normal access to deployment files without
    # replacing any supplementary groups it already belongs to.
    - name: Add admin to the Application Group
      ansible.builtin.user:
        name: "{{ app_admin_user }}"
        groups:
          - synth-app
        append: true


# ---------------------------------------------------------------------------
# Azure VM application deployment directory
#
# Permission policy:
#
# Directories: root:synth-app 0750
#   root       -> read/write/traverse
#   synth-app  -> read/traverse
#   others     -> no access
#
# Files: root:synth-app 0640
#   root       -> read/write
#   synth-app  -> read
#   others     -> no access
#
# Configuration changes are therefore performed by root, normally through
# Ansible or by an administrator explicitly using sudo.
# ---------------------------------------------------------------------------

- name: Setup Application Directory
  hosts: synth-vm
  become: true

  tasks:
    # Main deployment directory for the application stack on the Azure VM.
    - name: Create the main application directory
      ansible.builtin.file:
        path: /opt/synthetic-uptime-monitor
        owner: root
        group: synth-app
        state: directory
        mode: '0750'

    # Deploy the Compose definition used to run the FastAPI application
    # against the externally-managed PostgreSQL and Redis services.
    - name: Copy the deploy file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/azure-vm-compose.yml"
        dest: /opt/synthetic-uptime-monitor/docker-compose.yml
        owner: root
        group: synth-app
        mode: '0640'

    # Deploy the runtime environment generated for the Azure VM.
    # This file contains connection details and secrets, so access is
    # restricted to root and members of synth-app.
    - name: Copy the environment variables
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/.vm-deployment-env"
        dest: /opt/synthetic-uptime-monitor/.env
        owner: root
        group: synth-app
        mode: '0640'


# ---------------------------------------------------------------------------
# nginx site configuration
#
# The repository copy is the source of truth for nginx configuration.
# Ansible places it under sites-available, enables it through a symlink in
# sites-enabled, removes Ubuntu's default site, and reloads nginx.
#
# The active nginx configuration:
#   - accepts HTTP/HTTPS traffic for synthetic.nasrmoha.dev
#   - redirects HTTP to HTTPS
#   - terminates TLS
#   - proxies application requests to FastAPI on localhost:8000
# ---------------------------------------------------------------------------

- name: Setup nginx
  become: true
  hosts: synth-vm

  tasks:
    # Copy the project-specific nginx configuration onto the VM.
    - name: Copy in the Configuration file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/synthetic-uptime-monitor.conf"
        dest: /etc/nginx/sites-available/synthetic-uptime-monitor.conf
        owner: root
        group: root
        mode: '0644'

    # Enable the site without maintaining a second copy of the configuration.
    - name: Create a symbolic link from available to enabled
      ansible.builtin.file:
        src: /etc/nginx/sites-available/synthetic-uptime-monitor.conf
        dest: /etc/nginx/sites-enabled/synthetic-uptime-monitor.conf
        state: link

    # Disable Ubuntu's default nginx site so requests are handled by the
    # Synthetic Uptime Monitor server block instead.
    - name: Remove default config file
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    # Reload nginx so it re-reads the deployed configuration without a full
    # service restart. Mark this verification/application step as unchanged
    # so repeated playbook runs remain easier to interpret.
    - name: Reload nginx
      ansible.builtin.command:
        cmd: systemctl reload nginx
      changed_when: false


# ---------------------------------------------------------------------------
# Linux observability server
#
# The y540 server runs the Prometheus, Grafana, and Alertmanager containers.
# Monitoring configuration is copied from the repository and bind-mounted
# into those containers.
#
# Container processes do not necessarily share the host's synth-app group,
# so configuration files that must be read inside containers use world-readable
# permissions while remaining writable only by root.
# ---------------------------------------------------------------------------

- name: Setup Linux Server
  hosts: y540-server
  become: true

  tasks:
    # Root directory for the observability Compose deployment.
    - name: Create the main application directory
      ansible.builtin.file:
        path: /opt/synthetic-uptime-monitor
        owner: root
        group: synth-app
        state: directory
        mode: '0750'

    # Deploy environment values needed by the observability stack.
    # This file may contain secrets such as Grafana credentials, so access
    # remains restricted to root and synth-app.
    - name: Copy the environment variables
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/.linux-server-deployment-env"
        dest: /opt/synthetic-uptime-monitor/.env
        owner: root
        group: synth-app
        mode: '0640'

    # Copy the shared Prometheus/Grafana/Alertmanager configuration tree.
    #
    # These files are bind-mounted into containers, so directories must be
    # traversable and files readable by the container processes.
    - name: Copy monitoring configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring"
        dest: /opt/synthetic-uptime-monitor/
        owner: root
        group: synth-app
        mode: '0644'
        directory_mode: '0755'

    # Deploy the generated Prometheus configuration containing the current
    # address of the Azure VM that Prometheus should scrape.
    - name: Copy the Prometheus configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/linux-server-prometheus.yml"
        dest: /opt/synthetic-uptime-monitor/prometheus.yml
        owner: root
        group: synth-app
        mode: '0644'

    # Deploy the Compose definition that runs Prometheus, Grafana, and
    # Alertmanager on the Linux server.
    - name: Copy the deploy file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../deploy/linux-server-observe-compose.yml"
        dest: /opt/synthetic-uptime-monitor/docker-compose.yml
        owner: root
        group: synth-app
        mode: '0640'